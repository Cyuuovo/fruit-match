<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>对对碰 · 拆包版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe3f1 0%, #ffd6e8 40%, #e8e0ff 100%);
    min-height: 100vh; color:#5a3d4e; user-select:none; overflow-x:hidden;
  }
  .app { max-width:520px; margin:0 auto; padding:12px 12px 100px; display:flex; flex-direction:column; gap:10px; }

  .wish-bar {
    background: rgba(255,255,255,.75); border-radius:18px; padding:10px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 4px 14px rgba(255,150,190,.25);
    backdrop-filter: blur(6px);
  }
  .wish-item { display:flex; align-items:center; gap:6px; }
  .wish-label { font-size:12px; color:#b06a8a; font-weight:600; }
  .wish-fruit { font-size:28px; filter: drop-shadow(0 2px 4px rgba(255,120,170,.4)); animation: wishPulse 2s infinite; }
  @keyframes wishPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  .divider { width:1px; height:26px; background:rgba(255,150,190,.4); }
  .wish-hint { font-size:11px; color:#c98aa6; margin-left:auto; text-align:right; line-height:1.35; }

  .stats { display:flex; gap:8px; }
  .stat {
    flex:1; background:rgba(255,255,255,.7); border-radius:14px; padding:8px 4px; text-align:center;
    box-shadow:0 3px 10px rgba(255,150,190,.18);
  }
  .stat .num { font-size:20px; font-weight:800; color:#ff6fa5; }
  .stat .lbl { font-size:11px; color:#a77a92; margin-top:2px; }

  .shelf-row { display:grid; grid-template-columns: 1fr 3fr; gap:8px; align-items:stretch; }
  .shelf-col, .box-col { display:flex; flex-direction:column; }
  .shelf-title { font-size:11px; color:#b06a8a; font-weight:700; margin-bottom:6px; text-align:center; }
  .shelf-remain { font-size:11px; color:#ff6fa5; font-weight:800; text-align:center; margin-top:6px; }

  .shelf-area {
    flex:1; background:rgba(255,255,255,.5); border-radius:16px; padding:10px 6px;
    border:2px solid rgba(255,150,190,.3);
    display:flex; justify-content:center; align-items:center; position:relative;
    min-height:120px; cursor:pointer; transition: box-shadow .25s, border-color .25s;
  }
  .shelf-area.active-hint { border-color:#ffd84d; animation: shelfBreath 1.2s infinite; }
  @keyframes shelfBreath {
    0%,100%{ box-shadow:0 0 0 2px rgba(255,216,77,.5), 0 0 10px rgba(255,216,77,.4); }
    50%{ box-shadow:0 0 0 4px #ffd84d, 0 0 22px #ffd84d; }
  }
  .shelf-area.empty { opacity:.45; cursor:default; filter:grayscale(1); }

  .stack { position:relative; width:52px; height:64px; }
  .stack .sbox {
    position:absolute; width:42px; height:42px; border-radius:9px;
    background: linear-gradient(145deg,#ffc4db,#ff9cc4);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow: 2px 2px 0 #e0709f;
  }
  .stack .sbox:nth-child(1){ left:0; top:18px; transform:rotate(-8deg); }
  .stack .sbox:nth-child(2){ left:6px; top:10px; transform:rotate(4deg); }
  .stack .sbox:nth-child(3){ left:2px; top:2px; transform:rotate(-3deg); }
  .stack .sbox:nth-child(4){ left:8px; top:0; transform:rotate(7deg); opacity:.9; }

  .box-area {
    background:rgba(255,255,255,.55); border-radius:18px; padding:12px; min-height:88px;
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    border:2px dashed rgba(255,150,190,.4);
  }
  .box-empty { font-size:13px; color:#c9a3b8; text-align:center; }
  .blindbox {
    width:56px; height:56px; border-radius:14px; border:none; cursor:pointer;
    background: linear-gradient(145deg,#ffb3d1,#ff8fbf);
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:0 5px 0 #e0709f, 0 8px 14px rgba(224,112,159,.35);
    transition: transform .12s; position:relative;
  }
  .blindbox:active { transform:translateY(3px); box-shadow:0 2px 0 #e0709f; }
  .blindbox.opening { animation: shakeBox .45s ease; }
  @keyframes shakeBox {
    0%,100%{transform:rotate(0)} 20%{transform:rotate(-10deg) scale(1.05)}
    40%{transform:rotate(9deg) scale(1.05)} 60%{transform:rotate(-6deg)}
    80%{transform:rotate(4deg)}
  }

  .board {
    background:rgba(255,255,255,.65); border-radius:20px; padding:10px; min-height:180px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-content:start;
    box-shadow:inset 0 2px 12px rgba(255,170,200,.25); position:relative;
  }
  .fruit {
    aspect-ratio:1/1; border-radius:16px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:0 3px 8px rgba(200,150,180,.25); cursor:grab; position:relative;
    transition: transform .1s, box-shadow .1s; touch-action:none;
  }
  .fruit:active { cursor:grabbing; }
  .fruit.hint { animation: hintGlow 1.1s infinite; }
  @keyframes hintGlow {
    0%,100%{ box-shadow:0 3px 8px rgba(200,150,180,.25); }
    50%{ box-shadow:0 0 0 3px #ffd84d, 0 0 16px #ffd84d; }
  }
  .fruit.dragging { opacity:.65; transform:scale(1.08); z-index:50; }
  .fruit.pop { animation: popOut .3s forwards; }
  @keyframes popOut { to { transform:scale(0); opacity:0; } }
  .fruit.shake-back { animation: shakeBack .3s; }
  @keyframes shakeBack { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .fruit.hidden-fruit { box-shadow:0 0 0 2px #c78cff, 0 0 14px #c78cff; }
  .ghost-placeholder { visibility:hidden; pointer-events:none; }

  .float-score {
    position:fixed; font-weight:800; font-size:18px; color:#ff5b96; pointer-events:none;
    z-index:999; animation: floatUp .8s forwards; text-shadow:0 2px 6px rgba(255,255,255,.9);
  }
  .float-score.purple { color:#9b5cff; }
  @keyframes floatUp { to { transform:translateY(-46px); opacity:0; } }

  .tip { text-align:center; font-size:12.5px; color:#a77a92; min-height:18px; }
  .actions { display:flex; gap:10px; }
  .btn {
    flex:1; border:none; border-radius:16px; padding:14px; font-size:16px; font-weight:800;
    color:#fff; cursor:pointer; transition:transform .1s;
    background: linear-gradient(145deg,#ff9cc4,#ff6fa5);
    box-shadow:0 5px 0 #d9568a, 0 8px 16px rgba(217,86,138,.3);
  }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #d9568a; }
  .btn.green { background:linear-gradient(145deg,#8fe3a8,#4fc97a); box-shadow:0 5px 0 #35a860,0 8px 16px rgba(53,168,96,.3); }
  .btn.green.breath { animation: milkBreath 1s infinite; }
  @keyframes milkBreath {
    0%,100%{ box-shadow:0 5px 0 #35a860,0 8px 16px rgba(53,168,96,.3); }
    50%{ box-shadow:0 5px 0 #35a860,0 0 0 4px #ffe066,0 0 22px #ffe066; }
  }
  .btn.ghost-btn {
    background:rgba(255,255,255,.85); color:#b06a8a; box-shadow:0 4px 10px rgba(255,150,190,.25);
    border:1.5px solid rgba(255,150,190,.5);
  }
  .btn:disabled { opacity:.45; cursor:not-allowed; }

  .overlay {
    position:fixed; inset:0; background:rgba(90,61,78,.45); display:none;
    align-items:center; justify-content:center; z-index:100; padding:24px;
  }
  .overlay.show { display:flex; }
  .modal {
    background:#fff; border-radius:24px; padding:26px 22px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 20px 50px rgba(90,61,78,.35); animation: modalIn .3s; max-height:86vh; overflow-y:auto;
  }
  @keyframes modalIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h2 { color:#ff6fa5; font-size:20px; margin-bottom:8px; }
  .modal p { font-size:14px; color:#8a6478; margin-bottom:18px; line-height:1.6; }

  .ticket {
    background:#fffdf7; border-radius:18px; padding:22px 20px; width:100%; max-width:320px;
    box-shadow:0 20px 50px rgba(90,61,78,.35); animation: modalIn .3s;
    border:1px dashed rgba(255,150,190,.6);
  }
  .ticket-head { text-align:center; font-size:16px; font-weight:800; color:#ff6fa5; margin-bottom:14px; }
  .ticket-row {
    display:flex; justify-content:space-between; align-items:center;
    font-size:14px; color:#8a6478; padding:6px 0;
  }
  .ticket-row b { color:#5a3d4e; font-size:15px; }
  .ticket-dash { border-top:1px dashed rgba(255,150,190,.6); margin:12px 0 16px; }

  .set-section { text-align:left; margin-bottom:16px; }
  .set-section .sec-title { font-size:13px; font-weight:700; color:#b06a8a; margin-bottom:8px; }
  .seg { display:flex; gap:8px; }
  .seg button {
    flex:1; padding:10px; border-radius:12px; border:1.5px solid rgba(255,150,190,.5);
    background:#fff; color:#b06a8a; font-size:14px; font-weight:700; cursor:pointer;
  }
  .seg button.active { background:linear-gradient(145deg,#ff9cc4,#ff6fa5); color:#fff; border-color:transparent; }
  .opt-row { display:flex; gap:8px; flex-wrap:wrap; }
  .opt-row button {
    padding:9px 14px; border-radius:12px; border:1.5px solid rgba(255,150,190,.5);
    background:#fff; color:#b06a8a; font-size:15px; font-weight:700; cursor:pointer;
  }
  .opt-row button.active { background:linear-gradient(145deg,#ff9cc4,#ff6fa5); color:#fff; border-color:transparent; }
  .opt-row.fruits button { font-size:22px; padding:8px 12px; }
  .hidden { display:none !important; }

  .dock { position:fixed; left:0; right:0; bottom:0; z-index:60; display:flex; justify-content:center; padding:0 12px 12px; }
  .dock-inner { width:100%; max-width:520px; display:flex; gap:10px; }
  .dock-inner .btn { padding:12px; font-size:15px; }

  .firework-particle {
    position:fixed; width:8px; height:8px; border-radius:50%; pointer-events:none;
    z-index:998; animation: fwFly .9s ease-out forwards;
  }
  @keyframes fwFly {
    0% { transform:translate(0,0) scale(1); opacity:1; }
    100% { transform:translate(var(--dx), var(--dy)) scale(0.2); opacity:0; }
  }
  .float-score.firework-text {
    font-size:24px; color:#ff3d8b;
    text-shadow:0 0 8px #fff, 0 0 16px #ffb3d1;
    animation: fwText 1.2s ease-out forwards;
  }
  @keyframes fwText {
    0% { transform:translate(-50%,-50%) scale(0.5); opacity:0; }
    30% { transform:translate(-50%,-50%) scale(1.25); opacity:1; }
    70% { transform:translate(-50%,-70%) scale(1); opacity:1; }
    100% { transform:translate(-50%,-120%) scale(1); opacity:0; }
  }

  .guide-list { text-align:left; margin-bottom:18px; }
  .guide-list p { font-size:13.5px; color:#8a6478; line-height:1.7; margin:0; padding:2px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="wish-bar">
    <div class="wish-item">
      <span class="wish-label">许愿</span>
      <span class="wish-fruit" id="wishFruit">🍓</span>
    </div>
    <div class="divider"></div>
    <div class="wish-item">
      <span class="wish-label">隐藏</span>
      <span class="wish-fruit" id="hiddenFruit">🥑</span>
    </div>
    <span class="wish-hint">拆到各 +1 包</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statPairs">0</div><div class="lbl">碰对数</div></div>
    <div class="stat"><div class="num" id="statShelf">0</div><div class="lbl">货架剩余</div></div>
    <div class="stat"><div class="num" id="statPending">0</div><div class="lbl">待拆</div></div>
    <div class="stat"><div class="num" id="statClear">0</div><div class="lbl">清台</div></div>
  </div>

  <div class="shelf-row">
    <div class="shelf-col">
      <div class="shelf-title">📦 货架</div>
      <div class="shelf-area" id="shelfArea"></div>
      <div class="shelf-remain" id="shelfRemain"></div>
    </div>
    <div class="box-col">
      <div class="shelf-title">🎁 待拆区</div>
      <div class="box-area" id="boxArea"></div>
    </div>
  </div>

  <div class="board" id="board"></div>
  <div class="tip" id="tip">确认小票后开始拆包吧～</div>
  <div class="actions" id="actions"></div>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="btn ghost-btn" id="btnSettings">⚙️ 设置</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">本单结束啦！</h2>
    <p id="modalText"></p>
    <button class="btn" id="btnRestart">再来一单</button>
  </div>
</div>

<div class="overlay show" id="guideOverlay">
  <div class="modal">
    <h2>🎮 怎么玩</h2>
    <div class="guide-list">
      <p>1. 确认小票后，从货架拿满盲盒</p>
      <p>2. 点盲盒拆水果</p>
      <p>3. 拆完拖动相同水果碰掉，每碰一对 +1 包</p>
      <p>4. 拆到许愿款 / 隐藏款，各 +1 包</p>
      <p>5. 台面清空 = 清台，+3 包</p>
      <p>6. 没得碰了可以「奶一口」：可连续点，奶完点「去拿」再拿盲盒</p>
      <p>7. 拍一拆四奶一口，拍一拆九奶两口；奶满后仍可继续奶</p>
    </div>
    <button class="btn green" id="btnGuideOk">我知道啦</button>
  </div>
</div>

<div class="overlay" id="ticketOverlay">
  <div class="ticket">
    <div class="ticket-head">🎫 下单小票</div>
    <div class="ticket-row"><span>用户</span><b id="ticketUser">—</b></div>
    <div class="ticket-row"><span>下单</span><b id="ticketCount">—</b></div>
    <div class="ticket-row"><span>许愿款</span><b id="ticketWish">—</b></div>
    <div class="ticket-row"><span>隐藏款</span><b id="ticketHidden">—</b></div>
    <div class="ticket-dash"></div>
    <button class="btn green" id="btnTicketConfirm">确认，开拆！</button>
  </div>
</div>

<div class="overlay" id="setOverlay">
  <div class="modal">
    <h2>本单设置</h2>
    <div class="set-section">
      <div class="sec-title">主题</div>
      <div class="seg" id="themeSeg">
        <button data-theme="fruit">水果</button>
        <button data-theme="food">食物</button>
        <button data-theme="animal">动物</button>
      </div>
    </div>
    <div class="set-section">
      <div class="sec-title">模式</div>
      <div class="seg" id="modeSeg">
        <button data-mode="manual">我来定</button>
        <button data-mode="random">随缘拆</button>
      </div>
    </div>
    <div class="set-section" id="manualSection">
      <div class="sec-title">盲盒数</div>
      <div class="opt-row" id="countRow">
        <button data-count="2">2 个</button>
        <button data-count="4">4 个</button>
        <button data-count="9">9 个</button>
      </div>
      <div class="sec-title" style="margin-top:12px;">许愿款（不含隐藏）</div>
      <div class="opt-row fruits" id="wishRow"></div>
    </div>
    <div class="set-section">
      <div class="sec-title">音效</div>
      <div class="seg" id="soundSeg">
        <button data-sound="on">🔊 开</button>
        <button data-sound="off">🔇 关</button>
      </div>
    </div>
    <div class="actions" style="margin-top:6px;">
      <button class="btn green" id="btnRestartNow">立即重开这单</button>
      <button class="btn" id="btnApplyClose">应用并关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  let audioCtx = null;
  function unlockAudio(){
    const ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended") ctx.resume();
  }
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, duration, type, volume, when){
    if(!config.sound) return;
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume || 0.18, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }
  const SFX = {
    open(){ playTone(520, 0.09, "sine", 0.16, 0); playTone(780, 0.08, "sine", 0.12, 0.05); },
    match(){ playTone(300, 0.07, "square", 0.12, 0); playTone(620, 0.10, "triangle", 0.14, 0.04); },
    hidden(){
      playTone(660, 0.12, "sine", 0.16, 0);
      playTone(880, 0.12, "sine", 0.16, 0.10);
      playTone(1180, 0.18, "sine", 0.15, 0.20);
    },
    wish(){ playTone(700, 0.13, "triangle", 0.15, 0); playTone(990, 0.18, "triangle", 0.14, 0.11); },
    take(){ playTone(440, 0.06, "triangle", 0.14, 0); },
    milk(){ playTone(560, 0.10, "sine", 0.15, 0); playTone(700, 0.12, "sine", 0.12, 0.07); },
    clear(){
      playTone(660, 0.12, "triangle", 0.16, 0);
      playTone(880, 0.12, "triangle", 0.16, 0.10);
      playTone(1320, 0.22, "triangle", 0.15, 0.20);
    }
  };

  const THEMES = {
    fruit: { name:"水果", normals:["🥭","🍍","🍓","🍉","🍊","🍇","🍋","🍑"], hidden:"🥑" },
    food:  { name:"食物", normals:["🍔","🍗","🍞","🍤","🍪","🍧","🍮","🍜"], hidden:"🍣" },
    animal:{ name:"动物", normals:["🐟","🐹","🐻","🦊","🐶","🐨","🦁","🐵"], hidden:"🦄" }
  };
  const HIDDEN_RATE = 0.03;
  const CLEAR_BONUS = 3;
  const MILK_LIMIT = { 2:0, 4:1, 9:2 };

  const USERNAMES = [
    "撒娇只是顺手","来碗忘情牛肉面","你酸奶根葱","我芝士服了","鱼鱼一鱼",
    "抹茶起电","芝士就是力量","吾乃天之饺子","你美式吧","无事不登麦当劳",
    "土豆你个西红柿","你芝士甘薯么","奶盖不加糖","拆包小能手","水果姐本姐",
    "今天也要欧","碰碰不生气","盲盒收割机","许愿必中","隐藏款收藏家"
  ];

  const config = { theme:"fruit", mode:"random", count:9, wish:THEMES.fruit.normals[0], sound:true };
  let state = {};

  const $ = id => document.getElementById(id);
  const boardEl = $("board"), boxAreaEl = $("boxArea"), shelfAreaEl = $("shelfArea"),
        tipEl = $("tip"), actionsEl = $("actions"), overlayEl = $("overlay"),
        setOverlayEl = $("setOverlay"), ticketOverlayEl = $("ticketOverlay");

  const rand = n => Math.floor(Math.random()*n);
  const pick = arr => arr[rand(arr.length)];
  const curTheme = () => THEMES[config.theme];

  // ===== 货架队列工具（带来源标记）=====
  function shelfCount(){ return state.shelfItems.length; }
  function milkShelfCount(){ return state.shelfItems.filter(s => s.src === "milk").length; }
  function pushShelf(src, n){
    for(let i=0;i<n;i++) state.shelfItems.push({ src });
  }
  function popShelfFront(){ return state.shelfItems.shift(); } // 先进先出
  function removeLastMilk(){
    for(let i=state.shelfItems.length-1;i>=0;i--){
      if(state.shelfItems[i].src === "milk"){
        state.shelfItems.splice(i,1);
        return true;
      }
    }
    return false;
  }

  function getStartCount(){
    if(config.mode === "manual") return config.count;
    const r = Math.random();
    return r < 0.15 ? 2 : (r < 0.55 ? 4 : 9);
  }
  function rollFruit(){
    const t = curTheme();
    if(Math.random() < HIDDEN_RATE) return t.hidden;
    return pick(t.normals);
  }

  // ===== 开局 =====
  function newRound(){
    const t = curTheme();
    const startCount = getStartCount();
    const wish = config.mode === "manual" ? config.wish : pick(t.normals);
    const username = pick(USERNAMES);
    state = {
      username,
      ticketShown: true,
      theme: config.theme,
      wish,
      hidden: t.hidden,
      startCount,
      milkLimit: MILK_LIMIT[startCount] ?? 0,
      milkUsed: 0,
      shelfItems: Array.from({ length: startCount }, () => ({ src: "start" })),
      pending: 0,
      batchSize: startCount,
      fruits: [],
      pairs: 0,
      clears: 0,
      totalFruits: 0,
      hiddenCount: 0,
      wishCount: 0,
      clearBonusTotal: 0,
      phase: "shelf",
      ended: false,
      uid: 0
    };
    overlayEl.classList.remove("show");
    renderAll();
    renderTicket();
    setTip("确认小票后，去货架拿盒子吧～");
  }

  // ===== 渲染 =====
  function renderAll(){
    renderWish(); renderStats(); renderShelf(); renderBoxes(); renderBoard(); renderActions();
  }
  function renderWish(){
    $("wishFruit").textContent = state.wish;
    $("hiddenFruit").textContent = state.hidden;
  }
  function renderStats(){
    $("statPairs").textContent = state.pairs;
    $("statShelf").textContent = shelfCount();
    $("statPending").textContent = state.pending;
    $("statClear").textContent = state.clears;
  }
  function renderShelf(){
    shelfAreaEl.innerHTML = "";
    const isUndoMode = (state.phase === "match" && milkShelfCount() > 0);
    const needTake = (state.phase === "shelf" && shelfCount() > 0 && state.pending < state.batchSize);

    shelfAreaEl.classList.toggle("active-hint", needTake || isUndoMode);
    shelfAreaEl.classList.toggle("empty", shelfCount() <= 0);

    if(shelfCount() <= 0){
      $("shelfRemain").textContent = "";
    } else if(isUndoMode){
      $("shelfRemain").textContent = `剩 ${shelfCount()} 个 · 可点撤回`;
    } else {
      $("shelfRemain").textContent = `剩 ${shelfCount()} 个`;
    }

    if(shelfCount() <= 0){
      const stack = document.createElement("div");
      stack.className = "stack";
      for(let i=0;i<4;i++){
        const b = document.createElement("div");
        b.className = "sbox";
        b.textContent = "🎁";
        stack.appendChild(b);
      }
      shelfAreaEl.appendChild(stack);
      return;
    }

    const stack = document.createElement("div");
    stack.className = "stack";
    for(let i=0;i<4;i++){
      const b = document.createElement("div");
      b.className = "sbox";
      b.textContent = "🎁";
      stack.appendChild(b);
    }
    if(isUndoMode){
      stack.addEventListener("click", undoMilk);
    } else {
      stack.addEventListener("click", takeFromShelf);
    }
    shelfAreaEl.appendChild(stack);
  }
  function renderBoxes(){
    boxAreaEl.innerHTML = "";
    if(state.pending <= 0){
      const e = document.createElement("div");
      e.className = "box-empty";
      e.textContent = state.phase === "shelf"
        ? "点左边货架拿盒子，拿满就能拆啦"
        : (state.phase === "match" ? "拆包区空啦，去台面碰一碰！" : "暂无待拆");
      boxAreaEl.appendChild(e);
      return;
    }
    for(let i=0;i<state.pending;i++){
      const b = document.createElement("button");
      b.className = "blindbox";
      b.textContent = "🎁";
      b.addEventListener("click", openBox);
      boxAreaEl.appendChild(b);
    }
  }
  function renderBoard(){
    boardEl.innerHTML = "";
    state.fruits.forEach(f => {
      const d = document.createElement("div");
      d.className = "fruit";
      if(f.type === state.hidden) d.classList.add("hidden-fruit");
      d.dataset.id = f.id;
      d.dataset.type = f.type;
      d.textContent = f.type;
      attachDrag(d);
      boardEl.appendChild(d);
    });
    updateHints();
  }
  function renderActions(){
    actionsEl.innerHTML = "";
    if(state.ended) return;
    if(state.phase !== "match") return;
    if(state.pending > 0) return;

    const btnMilk = document.createElement("button");
    btnMilk.className = "btn green";
    btnMilk.style.flex = "0 0 25%";
    btnMilk.style.padding = "14px 6px";
    btnMilk.style.fontSize = "15px";
    btnMilk.textContent = "🍼 奶";
    btnMilk.addEventListener("click", milkOne);
    if(state.milkUsed < state.milkLimit) btnMilk.classList.add("breath");

    const btnGo = document.createElement("button");
    btnGo.className = "btn";
    btnGo.style.flex = "0 0 25%";
    btnGo.style.padding = "14px 6px";
    btnGo.style.fontSize = "15px";
    btnGo.textContent = "📦 去拿";
    btnGo.disabled = shelfCount() <= 0;
    btnGo.addEventListener("click", goTakeBoxes);

    const btnEnd = document.createElement("button");
    btnEnd.className = "btn";
    btnEnd.style.flex = "1";
    btnEnd.textContent = "结束这单";
    btnEnd.addEventListener("click", endRound);

    actionsEl.appendChild(btnMilk);
    actionsEl.appendChild(btnGo);
    actionsEl.appendChild(btnEnd);

    if(state.milkUsed < state.milkLimit){
      const left = state.milkLimit - state.milkUsed;
      setTip(`还可以奶 ${left} 口哦～（已奶 ${state.milkUsed}/${state.milkLimit}）`);
    }
  }
  function setTip(t){ tipEl.textContent = t; }

  // ===== 货架拿盒子（先进先出）=====
  function takeFromShelf(){
    if(state.ticketShown) return;
    if(state.phase !== "shelf") return;
    if(shelfCount() <= 0) return;
    if(state.pending >= state.batchSize) return;

    popShelfFront();
    state.pending++;
    renderAll();
    SFX.take();

    if(state.pending >= state.batchSize){
      state.phase = "open";
      renderAll();
      setTip("拿满啦，点盒子开拆吧～");
    } else {
      setTip(`还差 ${state.batchSize - state.pending} 个，继续拿～`);
    }
  }

  // ===== 拆包 =====
  function openBox(){
    if(state.ticketShown) return;
    if(state.phase !== "open") return;
    if(state.pending <= 0) return;

    const btn = event.currentTarget;
    if(btn.dataset.busy) return;
    btn.dataset.busy = "1";
    btn.classList.add("opening");
    SFX.open();
    const type = rollFruit();

    setTimeout(() => {
      state.pending--;
      state.totalFruits++;
      state.fruits.push({ id: ++state.uid, type });
      let msg = `拆到 ${type}！`;

      if(type === state.hidden){
        pushShelf("hidden", 1);
        state.hiddenCount++;
        msg += ` 隐藏款！+1 包 ✨`;
        floatText(btn, "隐藏！+1 包", true);
        SFX.hidden();
      } else if(type === state.wish){
        pushShelf("wish", 1);
        state.wishCount++;
        msg += ` 许愿中！+1 包 🎉`;
        floatText(btn, "许愿 +1 包");
        SFX.wish();
      }

      renderAll();
      setTip(msg);

      if(state.pending <= 0){
        if(shelfCount() > 0){
          state.phase = "shelf";
          state.batchSize = shelfCount();
          state.pending = 0;
          renderAll();
          setTip(`去货架把 ${shelfCount()} 个盒子都拿下来拆～`);
          return;
        }
        state.phase = "match";
        renderAll();
        checkClearOrMatch();
      }
    }, 460);
  }

  // ===== 奶一口 =====
  function milkOne(){
    if(state.phase !== "match") return;
    pushShelf("milk", 1);
    state.milkUsed++;
    renderAll();
    SFX.milk();
    setTip(`奶了一口！货架 +1（已奶 ${state.milkUsed}${state.milkLimit>0?"/"+state.milkLimit:""}），可以继续奶或点「去拿盒子」`);
  }

  function goTakeBoxes(){
    if(state.phase !== "match") return;
    if(shelfCount() <= 0) return;
    state.phase = "shelf";
    state.batchSize = shelfCount();
    state.pending = 0;
    renderAll();
    setTip(`去货架把 ${shelfCount()} 个盒子都拿下来拆～`);
  }

  function undoMilk(){
    if(state.phase !== "match") return;
    if(state.milkUsed <= 0) return;
    if(!removeLastMilk()) return;
    state.milkUsed--;
    SFX.take();
    renderAll();
    setTip(`撤回一口～（已奶 ${state.milkUsed}${state.milkLimit>0?"/"+state.milkLimit:""}）`);
  }

  // ===== 拖动碰 =====
  let dragEl = null, dragType = null, offsetX=0, offsetY=0;
  function attachDrag(el){ el.addEventListener("pointerdown", onDown); }

  function onDown(e){
    if(state.phase !== "match") return;
    if(dragEl) return;
    const el = e.currentTarget;
    dragEl = el; dragType = el.dataset.type;
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    const ghost = document.createElement("div");
    ghost.className = "fruit ghost-placeholder";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    el.parentNode.insertBefore(ghost, el.nextSibling);

    el.classList.add("dragging");
    el.style.width = rect.width + "px";
    el.style.height = rect.height + "px";
    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.zIndex = "50";

    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }
  function onMove(e){
    if(!dragEl) return;
    dragEl.style.left = (e.clientX - offsetX) + "px";
    dragEl.style.top  = (e.clientY - offsetY) + "px";
  }
  function onUp(e){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    if(!dragEl) return;
    const el = dragEl; dragEl = null;

    el.style.pointerEvents = "none";
    const target = document.elementFromPoint(e.clientX, e.clientY);
    el.style.pointerEvents = "";
    const targetFruit = target && target.closest ? target.closest(".fruit") : null;

    if(targetFruit && targetFruit.dataset.id !== el.dataset.id){
      if(targetFruit.dataset.type === dragType){ doMatch(el, targetFruit); return; }
      else { returnToSlot(el, true); return; }
    }
    returnToSlot(el, false);
  }
  function removeGhost(el){
    const g = el.parentNode && el.parentNode.querySelector(".ghost-placeholder");
    if(g) g.remove();
  }
  function returnToSlot(el, shake){
    el.classList.remove("dragging");
    el.style = "";
    removeGhost(el);
    if(shake){
      el.classList.add("shake-back");
      setTimeout(()=>el.classList.remove("shake-back"), 300);
    }
  }

  function doMatch(el, targetFruit){
    const idA = Number(el.dataset.id);
    const idB = Number(targetFruit.dataset.id);
    const r = targetFruit.getBoundingClientRect();
    floatAt(r.left + r.width/2, r.top, "碰！+1 包");
    SFX.match();

    el.style = "";
    el.classList.remove("dragging");
    removeGhost(el);
    el.classList.add("pop");
    targetFruit.classList.add("pop");

    const type = el.dataset.type;

    setTimeout(() => {
      state.fruits = state.fruits.filter(f => f.id !== idA && f.id !== idB);
      state.pairs++;

      const isClear = (state.fruits.length === 0);
      let addBoxes = 1;
      if(isClear){
        state.clears++;
        addBoxes += CLEAR_BONUS;
        state.clearBonusTotal += CLEAR_BONUS;
      }
      pushShelf(isClear ? "clear" : "match", addBoxes);
      state.pending = 0;

      if(isClear){
        setTip(`清台啦！碰对 +1 与清台 +${CLEAR_BONUS} 合并，货架 +${addBoxes} 包～`);
        const br = boardEl.getBoundingClientRect();
        firework(br.left + br.width/2, br.top + br.height/2, `清台！+${addBoxes} 包`);
        SFX.clear();
      } else {
        setTip(`碰掉一对 ${type}！货架 +1 包～`);
      }

      const typesNow = state.fruits.map(f=>f.type);
      const stillHasPair = typesNow.some((t,i)=>typesNow.indexOf(t,i+1) !== -1);
      if(stillHasPair){
        state.phase = "match";
        renderAll();
        return;
      }
      if(shelfCount() > 0){
        state.phase = "shelf";
        state.batchSize = shelfCount();
        state.pending = 0;
        renderAll();
        setTip(`碰完啦！去货架把 ${shelfCount()} 个盒子都拿下来拆～`);
        return;
      }
      state.phase = "match";
      renderAll();
      checkClearOrMatch();
    }, 300);
  }

  // ===== 阶段判断 =====
  function checkClearOrMatch(){
    if(shelfCount() > 0 || state.pending > 0){
      if(state.pending > 0){
        state.phase = "open";
      } else {
        state.phase = "shelf";
        state.batchSize = Math.min(state.batchSize, shelfCount());
        if(state.batchSize <= 0) state.batchSize = shelfCount();
      }
      renderAll();
      return;
    }
    const typesNow = state.fruits.map(f=>f.type);
    const stillHasPair = typesNow.some((t,i)=>typesNow.indexOf(t,i+1) !== -1);
    if(stillHasPair){
      state.phase = "match";
      renderAll();
      setTip("拖相同水果碰一碰！");
      return;
    }
    state.phase = "match";
    renderAll();
    if(state.milkUsed < state.milkLimit){
      const left = state.milkLimit - state.milkUsed;
      setTip(`还可以奶 ${left} 口哦～（已奶 ${state.milkUsed}/${state.milkLimit}）`);
    } else {
      setTip("奶满啦～点「奶一口」还能继续，或「结束这单」");
    }
  }

  function updateHints(){
    const els = boardEl.querySelectorAll(".fruit");
    const countMap = {};
    els.forEach(el => { const t = el.dataset.type; countMap[t]=(countMap[t]||0)+1; });
    els.forEach(el => {
      if(countMap[el.dataset.type] >= 2) el.classList.add("hint");
      else el.classList.remove("hint");
    });
  }

  function endRound(){
    if(state.ended) return;
    if(shelfCount() > 0 || state.pending > 0){
      setTip("还有盒子没拿完/没拆完，不能结束这单哦～");
      return;
    }
    state.ended = true;
    state.phase = "end";
    renderAll();
    $("modalTitle").textContent = "本单结束啦！";
    $("modalText").innerHTML =
      `本单开局：拍一拆 <b>${state.startCount}</b><br>` +
      `一共拆出 <b>${state.totalFruits}</b> 个<br>` +
      `共碰了 <b>${state.pairs}</b> 对<br>` +
      `清台 <b>${state.clears}</b> 次（+${state.clearBonusTotal} 包）<br>` +
      `隐藏出了 <b>${state.hiddenCount}</b> 个<br>` +
      `许愿中了 <b>${state.wishCount}</b> 次<br>` +
      `台面还剩 ${state.fruits.length} 个`;
    overlayEl.classList.add("show");
  }

  function floatText(el, txt, purple){
    const r = el.getBoundingClientRect();
    floatAt(r.left + r.width/2, r.top, txt, purple);
  }
  function floatAt(x, y, txt, purple){
    const d = document.createElement("div");
    d.className = "float-score" + (purple ? " purple" : "");
    d.textContent = txt;
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.style.transform = "translate(-50%,-50%)";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }
  function firework(x, y, text){
    const t = document.createElement("div");
    t.className = "float-score firework-text";
    t.textContent = text;
    t.style.left = x + "px";
    t.style.top = y + "px";
    t.style.transform = "translate(-50%,-50%)";
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 1300);

    const colors = ["#ff6fa5","#ffd84d","#8fe3a8","#9b5cff","#ff9cc4","#6fc8ff"];
    const count = 24;
    for(let i=0;i<count;i++){
      const p = document.createElement("div");
      p.className = "firework-particle";
      const angle = (Math.PI * 2 * i) / count + Math.random()*0.3;
      const dist = 70 + Math.random()*70;
      p.style.left = x + "px";
      p.style.top = y + "px";
      p.style.background = colors[i % colors.length];
      p.style.setProperty("--dx", Math.cos(angle)*dist + "px");
      p.style.setProperty("--dy", Math.sin(angle)*dist + "px");
      p.style.animationDelay = (Math.random()*0.08) + "s";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 1000);
    }
  }

  // ===== 小票 =====
  function renderTicket(){
    $("ticketUser").textContent = state.username;
    $("ticketCount").textContent = `拍一拆 ${state.startCount}`;
    $("ticketWish").textContent = state.wish;
    $("ticketHidden").textContent = state.hidden;
    ticketOverlayEl.classList.add("show");
  }
  $("btnTicketConfirm").addEventListener("click", ()=>{
    ticketOverlayEl.classList.remove("show");
    state.ticketShown = false;
    renderAll();
    setTip("去货架拿盒子吧～");
  });

  // ===== 设置 =====
  function openSettings(){ renderSettings(); setOverlayEl.classList.add("show"); }
  function closeSettings(){ setOverlayEl.classList.remove("show"); }
  function renderSettings(){
    document.querySelectorAll("#themeSeg button").forEach(b=>{
      b.classList.toggle("active", b.dataset.theme === config.theme);
    });
    document.querySelectorAll("#modeSeg button").forEach(b=>{
      b.classList.toggle("active", b.dataset.mode === config.mode);
    });
    document.querySelectorAll("#soundSeg button").forEach(b=>{
      b.classList.toggle("active", (b.dataset.sound === "on") === config.sound);
    });
    $("manualSection").classList.toggle("hidden", config.mode !== "manual");
    document.querySelectorAll("#countRow button").forEach(b=>{
      b.classList.toggle("active", Number(b.dataset.count) === config.count);
    });
    const wishRow = $("wishRow");
    wishRow.innerHTML = "";
    curTheme().normals.forEach(f=>{
      const b = document.createElement("button");
      b.textContent = f;
      if(f === config.wish) b.classList.add("active");
      b.addEventListener("click", ()=>{ config.wish = f; renderSettings(); });
      wishRow.appendChild(b);
    });
  }

  $("btnSettings").addEventListener("click", openSettings);
  $("btnApplyClose").addEventListener("click", closeSettings);
  $("btnRestartNow").addEventListener("click", ()=>{ closeSettings(); newRound(); });
  $("btnRestart").addEventListener("click", newRound);

  document.querySelectorAll("#themeSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{
      config.theme = b.dataset.theme;
      config.wish = THEMES[config.theme].normals[0];
      renderSettings();
    });
  });
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.mode = b.dataset.mode; renderSettings(); });
  });
  document.querySelectorAll("#soundSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.sound = (b.dataset.sound === "on"); renderSettings(); });
  });
  document.querySelectorAll("#countRow button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.count = Number(b.dataset.count); renderSettings(); });
  });

  document.addEventListener("pointerdown", unlockAudio, { passive:true });
  document.addEventListener("touchstart", unlockAudio, { passive:true });

  $("btnGuideOk").addEventListener("click", ()=>{
    $("guideOverlay").classList.remove("show");
    newRound();
  });
})();
</script>
</body>
</html>
