<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>对对碰 · 拆包版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #ffe3f1 0%, #ffd6e8 40%, #e8e0ff 100%);
    min-height: 100vh; color:#5a3d4e; user-select:none; overflow-x:hidden;
  }
  .app { max-width:520px; margin:0 auto; padding:12px 12px 100px; display:flex; flex-direction:column; gap:10px; }

  .wish-bar {
    background: rgba(255,255,255,.75); border-radius:18px; padding:10px 12px;
    display:flex; align-items:center; gap:10px; box-shadow:0 4px 14px rgba(255,150,190,.25);
    backdrop-filter: blur(6px);
  }
  .wish-item { display:flex; align-items:center; gap:6px; }
  .wish-label { font-size:12px; color:#b06a8a; font-weight:600; }
  .wish-fruit { font-size:28px; filter: drop-shadow(0 2px 4px rgba(255,120,170,.4)); animation: wishPulse 2s infinite; }
  .wish-fruit.hidden-tag { animation:none; opacity:.85; }
  @keyframes wishPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.12)} }
  .divider { width:1px; height:26px; background:rgba(255,150,190,.4); }
  .wish-hint { font-size:11px; color:#c98aa6; margin-left:auto; text-align:right; line-height:1.35; }

  .stats { display:flex; gap:8px; }
  .stat {
    flex:1; background:rgba(255,255,255,.7); border-radius:14px; padding:8px 4px; text-align:center;
    box-shadow:0 3px 10px rgba(255,150,190,.18);
  }
  .stat .num { font-size:20px; font-weight:800; color:#ff6fa5; }
  .stat .lbl { font-size:11px; color:#a77a92; margin-top:2px; }

  .box-area {
    background:rgba(255,255,255,.55); border-radius:18px; padding:12px; min-height:88px;
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
    border:2px dashed rgba(255,150,190,.4);
  }
  .box-empty { font-size:13px; color:#c9a3b8; }
  .blindbox {
    width:56px; height:56px; border-radius:14px; border:none; cursor:pointer;
    background: linear-gradient(145deg,#ffb3d1,#ff8fbf);
    display:flex; align-items:center; justify-content:center; font-size:26px;
    box-shadow:0 5px 0 #e0709f, 0 8px 14px rgba(224,112,159,.35);
    transition: transform .12s; position:relative;
  }
  .blindbox:active { transform:translateY(3px); box-shadow:0 2px 0 #e0709f; }
  .blindbox.opening { animation: shakeBox .45s ease; }
  @keyframes shakeBox {
    0%,100%{transform:rotate(0)} 20%{transform:rotate(-10deg) scale(1.05)}
    40%{transform:rotate(9deg) scale(1.05)} 60%{transform:rotate(-6deg)}
    80%{transform:rotate(4deg)}
  }

  .board {
    background:rgba(255,255,255,.65); border-radius:20px; padding:12px; min-height:220px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px; align-content:start;
    box-shadow:inset 0 2px 12px rgba(255,170,200,.25); position:relative;
  }
  .fruit {
    aspect-ratio:1/1; border-radius:16px; background:#fff;
    display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow:0 3px 8px rgba(200,150,180,.25); cursor:grab; position:relative;
    transition: transform .1s, box-shadow .1s; touch-action:none;
  }
  .fruit:active { cursor:grabbing; }
  .fruit.hint { animation: hintGlow 1.1s infinite; }
  @keyframes hintGlow {
    0%,100%{ box-shadow:0 3px 8px rgba(200,150,180,.25); }
    50%{ box-shadow:0 0 0 3px #ffd84d, 0 0 16px #ffd84d; }
  }
  .fruit.dragging { opacity:.65; transform:scale(1.08); z-index:50; }
  .fruit.pop { animation: popOut .3s forwards; }
  @keyframes popOut { to { transform:scale(0); opacity:0; } }
  .fruit.shake-back { animation: shakeBack .3s; }
  @keyframes shakeBack { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  .fruit.hidden-fruit { box-shadow:0 0 0 2px #c78cff, 0 0 14px #c78cff; }
  .ghost-placeholder { visibility:hidden; pointer-events:none; }

  .float-score {
    position:fixed; font-weight:800; font-size:18px; color:#ff5b96; pointer-events:none;
    z-index:999; animation: floatUp .8s forwards; text-shadow:0 2px 6px rgba(255,255,255,.9);
  }
  .float-score.purple { color:#9b5cff; }
  @keyframes floatUp { to { transform:translateY(-46px); opacity:0; } }

  .tip { text-align:center; font-size:12.5px; color:#a77a92; min-height:18px; }
  .actions { display:flex; gap:10px; }
  .btn {
    flex:1; border:none; border-radius:16px; padding:14px; font-size:16px; font-weight:800;
    color:#fff; cursor:pointer; transition:transform .1s;
    background: linear-gradient(145deg,#ff9cc4,#ff6fa5);
    box-shadow:0 5px 0 #d9568a, 0 8px 16px rgba(217,86,138,.3);
  }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #d9568a; }
  .btn.green { background:linear-gradient(145deg,#8fe3a8,#4fc97a); box-shadow:0 5px 0 #35a860,0 8px 16px rgba(53,168,96,.3); }
  .btn.green.breath { animation: milkBreath 1s infinite; }
  @keyframes milkBreath {
    0%,100%{ box-shadow:0 5px 0 #35a860,0 8px 16px rgba(53,168,96,.3); }
    50%{ box-shadow:0 5px 0 #35a860,0 0 0 4px #ffe066,0 0 22px #ffe066; }
  }
  .btn.ghost-btn {
    background:rgba(255,255,255,.85); color:#b06a8a; box-shadow:0 4px 10px rgba(255,150,190,.25);
    border:1.5px solid rgba(255,150,190,.5);
  }

  .overlay {
    position:fixed; inset:0; background:rgba(90,61,78,.45); display:none;
    align-items:center; justify-content:center; z-index:100; padding:24px;
  }
  .overlay.show { display:flex; }
  .modal {
    background:#fff; border-radius:24px; padding:26px 22px; text-align:center; max-width:340px; width:100%;
    box-shadow:0 20px 50px rgba(90,61,78,.35); animation: modalIn .3s; max-height:86vh; overflow-y:auto;
  }
  @keyframes modalIn { from{transform:scale(.85);opacity:0} to{transform:scale(1);opacity:1} }
  .modal h2 { color:#ff6fa5; font-size:20px; margin-bottom:8px; }
  .modal p { font-size:14px; color:#8a6478; margin-bottom:18px; line-height:1.6; }

  .set-section { text-align:left; margin-bottom:16px; }
  .set-section .sec-title { font-size:13px; font-weight:700; color:#b06a8a; margin-bottom:8px; }
  .seg { display:flex; gap:8px; }
  .seg button {
    flex:1; padding:10px; border-radius:12px; border:1.5px solid rgba(255,150,190,.5);
    background:#fff; color:#b06a8a; font-size:14px; font-weight:700; cursor:pointer;
  }
  .seg button.active { background:linear-gradient(145deg,#ff9cc4,#ff6fa5); color:#fff; border-color:transparent; }
  .opt-row { display:flex; gap:8px; flex-wrap:wrap; }
  .opt-row button {
    padding:9px 14px; border-radius:12px; border:1.5px solid rgba(255,150,190,.5);
    background:#fff; color:#b06a8a; font-size:15px; font-weight:700; cursor:pointer;
  }
  .opt-row button.active { background:linear-gradient(145deg,#ff9cc4,#ff6fa5); color:#fff; border-color:transparent; }
  .opt-row.fruits button { font-size:22px; padding:8px 12px; }
  .hidden { display:none !important; }

  .dock {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    display:flex; justify-content:center; padding:0 12px 12px;
  }
  .dock-inner { width:100%; max-width:520px; display:flex; gap:10px; }
  .dock-inner .btn { padding:12px; font-size:15px; }
</style>
</head>
<body>
<div class="app">
  <div class="wish-bar">
    <div class="wish-item">
      <span class="wish-label">许愿</span>
      <span class="wish-fruit" id="wishFruit">🍓</span>
    </div>
    <div class="divider"></div>
    <div class="wish-item">
      <span class="wish-label">隐藏</span>
      <span class="wish-fruit hidden-tag" id="hiddenFruit">❓</span>
    </div>
    <span class="wish-hint">拆到各 +1 包</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statPairs">0</div><div class="lbl">碰对数</div></div>
    <div class="stat"><div class="num" id="statBoxes">0</div><div class="lbl">待拆盲盒</div></div>
    <div class="stat"><div class="num" id="statClear">0</div><div class="lbl">清台次数</div></div>
  </div>

  <div class="box-area" id="boxArea"></div>
  <div class="board" id="board"></div>
  <div class="tip" id="tip">点盲盒开始拆包吧～</div>
  <div class="actions" id="actions"></div>
</div>

<div class="dock">
  <div class="dock-inner">
    <button class="btn ghost-btn" id="btnSettings">⚙️ 设置</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">本单结束啦！</h2>
    <p id="modalText"></p>
    <button class="btn" id="btnRestart">再来一单</button>
  </div>
</div>

<div class="overlay" id="setOverlay">
  <div class="modal">
    <h2>本单设置</h2>

    <div class="set-section">
      <div class="sec-title">主题</div>
      <div class="seg" id="themeSeg">
        <button data-theme="fruit">水果</button>
        <button data-theme="food">食物</button>
        <button data-theme="animal">动物</button>
      </div>
    </div>

    <div class="set-section">
      <div class="sec-title">音效</div>
      <div class="seg" id="soundSeg">
        <button data-sound="on">🔊 开</button>
        <button data-sound="off">🔇 关</button>
      </div>
    </div>

    <div class="set-section">
      <div class="sec-title">模式</div>
      <div class="seg" id="modeSeg">
        <button data-mode="manual">我来定</button>
        <button data-mode="random">随缘拆</button>
      </div>
    </div>

    <div class="set-section" id="manualSection">
      <div class="sec-title">盲盒数</div>
      <div class="opt-row" id="countRow">
        <button data-count="2">2 个</button>
        <button data-count="4">4 个</button>
        <button data-count="9">9 个</button>
      </div>
      <div class="sec-title" style="margin-top:12px;">许愿款（不含隐藏）</div>
      <div class="opt-row fruits" id="wishRow"></div>
    </div>

    <div class="actions" style="margin-top:6px;">
      <button class="btn green" id="btnRestartNow">立即重开这单</button>
      <button class="btn" id="btnApplyClose">应用并关闭</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

// ===== 合成音效引擎 =====
  let audioCtx = null;
  // 安卓/Chrome 解锁：任意点击先唤醒 AudioContext
  function unlockAudio(){
    const ctx = getAudioCtx();
    if(ctx && ctx.state === "suspended") ctx.resume();
  }
  document.addEventListener("pointerdown", unlockAudio, { passive:true });
  document.addEventListener("touchstart", unlockAudio, { passive:true });
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }
  function playTone(freq, duration, type, volume, when){
    if(!config.sound) return;
    const ctx = getAudioCtx();
    if(!ctx) return;
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(volume || 0.18, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.05);
  }
  const SFX = {
    open(){   // 拆包：短促"啵"
      playTone(520, 0.09, "sine", 0.16, 0);
      playTone(780, 0.08, "sine", 0.12, 0.05);
    },
    match(){  // 碰掉："啪"两连
      playTone(300, 0.07, "square", 0.12, 0);
      playTone(620, 0.10, "triangle", 0.14, 0.04);
    },
    hidden(){ // 隐藏：上行"叮叮~"
      playTone(660, 0.12, "sine", 0.16, 0);
      playTone(880, 0.12, "sine", 0.16, 0.10);
      playTone(1180, 0.18, "sine", 0.15, 0.20);
    },
    wish(){   // 许愿：上行两连，比隐藏柔和
      playTone(700, 0.13, "triangle", 0.15, 0);
      playTone(990, 0.18, "triangle", 0.14, 0.11);
    }
  };

  // ===== 主题配置：8 普通 + 1 隐藏 =====
  const THEMES = {
    fruit: {
      name: "水果",
      normals: ["🥭","🍍","🍓","🍉","🍊","🍇","🍋","🍑"],
      hidden: "🥑"
    },
    food: {
      name: "食物",
      normals: ["🍔","🍗","🍞","🍤","🍪","🍧","🍮","🍜"],
      hidden: "🍣"
    },
    animal: {
      name: "动物",
      normals: ["🐟","🐹","🐻","🦊","🐶","🐨","🦁","🐵"],
      hidden: "🦄"
    }
  };
  const HIDDEN_RATE = 0.03;
  const CLEAR_BONUS = 3;
  const MILK_LIMIT = { 2:1, 4:2, 9:3 };

  const config = {
    theme: "fruit",
    mode: "random",
    count: 9,
    wish: THEMES.fruit.normals[0],
    sound: true
  };

  let state = {};

  const $ = id => document.getElementById(id);
  const boardEl = $("board"), boxAreaEl = $("boxArea"), tipEl = $("tip"),
        actionsEl = $("actions"), overlayEl = $("overlay"), setOverlayEl = $("setOverlay");

  const rand = n => Math.floor(Math.random()*n);
  const pick = arr => arr[rand(arr.length)];
  const curTheme = () => THEMES[config.theme];

  function getStartCount(){
    if(config.mode === "manual") return config.count;
    const r = Math.random();
    return r < 0.15 ? 2 : (r < 0.55 ? 4 : 9);
  }
  function rollFruit(){
    const t = curTheme();
    if(Math.random() < HIDDEN_RATE) return t.hidden;
    return pick(t.normals);
  }

  // ===== 开局 =====
  function newRound(){
    const t = curTheme();
    const startCount = getStartCount();
    const wish = config.mode === "manual" ? config.wish : pick(t.normals);
    state = {
      theme: config.theme,
      wish,
      hidden: t.hidden,
      startCount,
      milkLimit: MILK_LIMIT[startCount] || 1,
      milkUsed: 0,
      boxes: startCount,
      fruits: [],
      pairs: 0,
      clears: 0,
      totalFruits: 0,
      hiddenCount: 0,    // 本单拆出隐藏次数
      wishCount: 0,      // 本单许愿中次数
      clearBonusTotal: 0, // 本单清台累计奖励包数
      phase: "open",
      ended: false,
      uid: 0
    };
    overlayEl.classList.remove("show");
    renderAll();
    setTip("点盲盒开始拆包吧～");
  }

  // ===== 渲染 =====
  function renderAll(){
    renderWish(); renderStats(); renderBoxes(); renderBoard(); renderActions();
  }
  function renderWish(){
    $("wishFruit").textContent = state.wish;
    $("hiddenFruit").textContent = state.hidden; // 顶部直接显示隐藏真身？见下方说明
  }
  function renderStats(){
    $("statPairs").textContent = state.pairs;
    $("statBoxes").textContent = state.boxes;
    $("statClear").textContent = state.clears;
  }
  function renderBoxes(){
    boxAreaEl.innerHTML = "";
    if(state.boxes <= 0){
      const e = document.createElement("div");
      e.className = "box-empty";
      e.textContent = state.phase === "match" ? "盲盒拆完啦，去台面碰一碰！" : "暂无盲盒";
      boxAreaEl.appendChild(e);
      return;
    }
    for(let i=0;i<state.boxes;i++){
      const b = document.createElement("button");
      b.className = "blindbox";
      b.textContent = "🎁";
      b.addEventListener("click", () => openBox(b));
      boxAreaEl.appendChild(b);
    }
  }
  function renderBoard(){
    boardEl.innerHTML = "";
    state.fruits.forEach(f => {
      const d = document.createElement("div");
      d.className = "fruit";
      if(f.type === state.hidden) d.classList.add("hidden-fruit");
      d.dataset.id = f.id;
      d.dataset.type = f.type;
      d.textContent = f.type;
      attachDrag(d);
      boardEl.appendChild(d);
    });
    updateHints();
  }
  function renderActions(){
    actionsEl.innerHTML = "";
    if(state.ended) return;
    if(state.phase === "match" && state.boxes === 0){
      const btnMilk = document.createElement("button");
      btnMilk.className = "btn green";
      btnMilk.textContent = "🍼 奶一口";
      btnMilk.addEventListener("click", milkOne);
      if(state.milkUsed < state.milkLimit) btnMilk.classList.add("breath");

      const btnEnd = document.createElement("button");
      btnEnd.className = "btn";
      btnEnd.textContent = "结束这单";
      btnEnd.addEventListener("click", endRound);

      actionsEl.appendChild(btnMilk);
      actionsEl.appendChild(btnEnd);

      if(state.milkUsed < state.milkLimit){
        const left = state.milkLimit - state.milkUsed;
        setTip(`还可以奶 ${left} 口哦～（已奶 ${state.milkUsed}/${state.milkLimit}）`);
      }
    }
  }
  function setTip(t){ tipEl.textContent = t; }

  // ===== 拆包 =====
  function openBox(btn){
    if(state.boxes <= 0 || state.phase !== "open") return;
    if(btn.dataset.busy) return;
    btn.dataset.busy = "1";
    btn.classList.add("opening");
    const type = rollFruit();
    SFX.open();

    setTimeout(() => {
      state.boxes--;
      state.totalFruits++;
      state.fruits.push({ id: ++state.uid, type });
      let msg = `拆到 ${type}！`;

      if(type === state.hidden){
        state.boxes++;
        state.hiddenCount++;
        SFX.hidden();
        msg += ` 隐藏款！+1 包 ✨`;
        floatText(btn, "隐藏！+1 包", true);
      } else if(type === state.wish){
        state.boxes++;
        state.wishCount++;
        SFX.wish();
        msg += ` 许愿中！+1 包 🎉`;
        floatText(btn, "许愿 +1 包");
      }

      renderAll();
      setTip(msg);

      if(state.boxes <= 0){
        state.phase = "match";
        renderAll();
        checkClearOrMatch();
      }
    }, 460);
  }

  // ===== 奶一口 =====
  function milkOne(){
    if(state.phase !== "match") return;
    state.boxes += 1;
    state.milkUsed++;
    state.phase = "open";
    renderAll();
    setTip("奶一口！再拆一个～");
  }

  // ===== 拖动 =====
  let dragEl = null, dragType = null, offsetX=0, offsetY=0;
  function attachDrag(el){ el.addEventListener("pointerdown", onDown); }

  function onDown(e){
    if(state.phase !== "match") return;
    if(dragEl) return;
    const el = e.currentTarget;
    dragEl = el; dragType = el.dataset.type;
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;

    const ghost = document.createElement("div");
    ghost.className = "fruit ghost-placeholder";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    el.parentNode.insertBefore(ghost, el.nextSibling);

    el.classList.add("dragging");
    el.style.width = rect.width + "px";
    el.style.height = rect.height + "px";
    el.style.position = "fixed";
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.zIndex = "50";

    el.setPointerCapture && el.setPointerCapture(e.pointerId);
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
    document.addEventListener("pointercancel", onUp);
  }

  function onMove(e){
    if(!dragEl) return;
    dragEl.style.left = (e.clientX - offsetX) + "px";
    dragEl.style.top  = (e.clientY - offsetY) + "px";
  }

  function onUp(e){
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    if(!dragEl) return;
    const el = dragEl; dragEl = null;

    el.style.pointerEvents = "none";
    const target = document.elementFromPoint(e.clientX, e.clientY);
    el.style.pointerEvents = "";
    const targetFruit = target && target.closest ? target.closest(".fruit") : null;

    if(targetFruit && targetFruit.dataset.id !== el.dataset.id){
      if(targetFruit.dataset.type === dragType){
        doMatch(el, targetFruit);
        return;
      } else {
        returnToSlot(el, true);
        return;
      }
    }
    returnToSlot(el, false);
  }

  function removeGhost(el){
    const g = el.parentNode && el.parentNode.querySelector(".ghost-placeholder");
    if(g) g.remove();
  }

  function returnToSlot(el, shake){
    el.classList.remove("dragging");
    el.style = "";
    removeGhost(el);
    if(shake){
      el.classList.add("shake-back");
      setTimeout(()=>el.classList.remove("shake-back"), 300);
    }
  }

  function doMatch(el, targetFruit){
    const idA = Number(el.dataset.id);
    const idB = Number(targetFruit.dataset.id);
    const r = targetFruit.getBoundingClientRect();
    floatAt(r.left + r.width/2, r.top, "碰！+1 包");

    el.style = "";
    el.classList.remove("dragging");
    removeGhost(el);
    el.classList.add("pop");
    targetFruit.classList.add("pop");

    const type = el.dataset.type;
    SFX.match();

    setTimeout(() => {
      state.fruits = state.fruits.filter(f => f.id !== idA && f.id !== idB);
      state.pairs++;
      state.boxes++;
      renderAll();
      setTip(`碰掉一对 ${type}！+1 包`);
      checkClearOrMatch();
    }, 300);
  }

  // ===== 清台 / 阶段 =====
  function checkClearOrMatch(){
    if(state.fruits.length === 0 && state.pairs > 0){
      state.clears++;
      state.boxes += CLEAR_BONUS;
      state.clearBonusTotal += CLEAR_BONUS;
      state.phase = "open";
      renderAll();
      setTip(`清台啦！+${CLEAR_BONUS} 包 🎉`);
      return;
    }
    const typesNow = state.fruits.map(f=>f.type);
    const stillHasPair = typesNow.some((t,i)=>typesNow.indexOf(t,i+1) !== -1);
    if(stillHasPair){
      state.phase = "match";
      renderAll();
      setTip("继续碰！盲盒先攒着～");
      return;
    }
    if(state.boxes > 0){
      state.phase = "open";
      renderAll();
      setTip("碰完啦，去拆攒下的盲盒吧～");
      return;
    }
    state.phase = "match";
    renderAll();
    if(state.milkUsed < state.milkLimit){
      const left = state.milkLimit - state.milkUsed;
      setTip(`还可以奶 ${left} 口哦～（已奶 ${state.milkUsed}/${state.milkLimit}）`);
    } else {
      setTip("奶满啦～点「奶一口」还能继续，或「结束这单」");
    }
  }

  function updateHints(){
    const els = boardEl.querySelectorAll(".fruit");
    const countMap = {};
    els.forEach(el => { const t = el.dataset.type; countMap[t]=(countMap[t]||0)+1; });
    els.forEach(el => {
      if(countMap[el.dataset.type] >= 2) el.classList.add("hint");
      else el.classList.remove("hint");
    });
  }

  function endRound(){
    if(state.ended) return;
    state.ended = true;
    state.phase = "end";
    renderAll();
    $("modalTitle").textContent = "本单结束啦！";
    $("modalText").innerHTML =
      `本单开局：拍一拆 <b>${state.startCount}</b><br>` +
      `一共拆出 <b>${state.totalFruits}</b> 个<br>` +
      `共碰了 <b>${state.pairs}</b> 对<br>` +
      `清台 <b>${state.clears}</b> 次（+${state.clearBonusTotal} 包）<br>` +
      `隐藏出了 <b>${state.hiddenCount}</b> 个<br>` +
      `许愿中了 <b>${state.wishCount}</b> 次<br>` +
      `台面还剩 ${state.fruits.length} 个`;
    overlayEl.classList.add("show");
  }

  function floatText(el, txt, purple){
    const r = el.getBoundingClientRect();
    floatAt(r.left + r.width/2, r.top, txt, purple);
  }
  function floatAt(x, y, txt, purple){
    const d = document.createElement("div");
    d.className = "float-score" + (purple ? " purple" : "");
    d.textContent = txt;
    d.style.left = x + "px";
    d.style.top = y + "px";
    d.style.transform = "translate(-50%,-50%)";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 800);
  }

  // ===== 设置 =====
  function openSettings(){ renderSettings(); setOverlayEl.classList.add("show"); }
  function closeSettings(){ setOverlayEl.classList.remove("show"); }

  function renderSettings(){
    document.querySelectorAll("#themeSeg button").forEach(b=>{
      b.classList.toggle("active", b.dataset.theme === config.theme);
    });
    document.querySelectorAll("#modeSeg button").forEach(b=>{
      b.classList.toggle("active", b.dataset.mode === config.mode);
    });
    document.querySelectorAll("#soundSeg button").forEach(b=>{
      b.classList.toggle("active", (b.dataset.sound === "on") === config.sound);
    });
    $("manualSection").classList.toggle("hidden", config.mode !== "manual");
    document.querySelectorAll("#countRow button").forEach(b=>{
      b.classList.toggle("active", Number(b.dataset.count) === config.count);
    });
    const wishRow = $("wishRow");
    wishRow.innerHTML = "";
    curTheme().normals.forEach(f=>{
      const b = document.createElement("button");
      b.textContent = f;
      if(f === config.wish) b.classList.add("active");
      b.addEventListener("click", ()=>{ config.wish = f; renderSettings(); });
      wishRow.appendChild(b);
    });
  }

  $("btnSettings").addEventListener("click", openSettings);
  $("btnApplyClose").addEventListener("click", closeSettings);
  $("btnRestartNow").addEventListener("click", ()=>{ closeSettings(); newRound(); });
  $("btnRestart").addEventListener("click", newRound);

  document.querySelectorAll("#themeSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{
      config.theme = b.dataset.theme;
      // 切主题时许愿款重置为该主题第一个普通款
      config.wish = THEMES[config.theme].normals[0];
      renderSettings();
    });
  });
  document.querySelectorAll("#modeSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.mode = b.dataset.mode; renderSettings(); });
  });
  document.querySelectorAll("#soundSeg button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.sound = (b.dataset.sound === "on"); renderSettings(); });
  });
  document.querySelectorAll("#countRow button").forEach(b=>{
    b.addEventListener("click", ()=>{ config.count = Number(b.dataset.count); renderSettings(); });
  });

  newRound();
})();
</script>
</body>
</html>
